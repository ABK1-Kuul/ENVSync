name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
        include:
          # The minimum version declared in package.json "engines".
          - os: ubuntu-latest
            node: "22.12.0"
    steps:
      # Actions are pinned to full commit SHAs; the comment records the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # Not Corepack: the Corepack bundled with Node 22.12.0 cannot run pnpm >= 11, and Corepack
      # releases that can require Node >= 22.22.2. Installing the exact pinned version works on
      # every matrix entry without a third-party action. Keep in sync with "packageManager"
      # (enforced by tests/security/boundaries.test.ts).
      - name: Install pnpm
        run: npm install --global pnpm@12.10.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Runs the real binary through Node's package resolution (not Vitest's aliases). The drift
      # fixture must report findings: exit 1 is the expected result, while 0 or 2 fail the step.
      - name: Smoke-test the built CLI
        run: |
          rc=0
          node apps/cli/dist/bin.js scan tests/fixtures/next-pages-router --format json > /dev/null || rc=$?
          if [ "$rc" -ne 1 ]; then echo "expected exit code 1 (findings), got $rc"; exit 1; fi
        shell: bash

      # The publishable artifact, staged outside the checkout: exactly five files, one bundled
      # script whose only non-builtin import is typescript, and no internal package names.
      - name: Stage, pack and check the publishable CLI
        # On Windows, RUNNER_TEMP is a drive path (D:\a\_temp). GNU tar in Git Bash reads "D:" as a
        # remote host, so after staging everything below uses paths relative to RUNNER_TEMP.
        # Sorting uses LC_ALL=C so the file-list comparison does not depend on the runner locale.
        run: |
          workspace="$PWD"
          node apps/cli/scripts/stage.mjs --out "$RUNNER_TEMP/envsync-stage"
          cd "$RUNNER_TEMP"
          npm pack ./envsync-stage --pack-destination . --ignore-scripts
          tarball=$(ls envsync-*.tgz)
          tar -tzf "$tarball" | LC_ALL=C sort > contents.txt
          printf '%s\n' package/CHANGELOG.md package/LICENSE package/README.md package/dist/envsync.js package/package.json | LC_ALL=C sort > expected.txt
          diff expected.txt contents.txt
          # Code and manifest only: the CHANGELOG legitimately mentions the internal scope. Extracted to
          # a file first: in a pipe, an early `grep -q` match makes tar fail with SIGPIPE, and with
          # pipefail the `if` would then take the "no leak" branch.
          tar -xzOf "$tarball" package/dist/envsync.js package/package.json > shipped-code.txt
          if grep -q '@envsync-internal' shipped-code.txt; then echo "internal package name leaked into the package"; exit 1; fi
          # Install the tarball like a user would, in a fresh project outside the checkout.
          mkdir consumer
          cd consumer
          npm init --yes > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "../$tarball"
          npx --no-install envsync --version
          rc=0
          npx --no-install envsync scan "$workspace/tests/fixtures/next-pages-router" --format json > /dev/null || rc=$?
          if [ "$rc" -ne 1 ]; then echo "expected exit code 1 (findings), got $rc"; exit 1; fi
        shell: bash

  vscode-extension:
    name: VS Code extension (real editor tests, packaging)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install --global pnpm@12.10.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Downloads VS Code 1.95.0 (the oldest version the extension supports) and runs the suite in
      # it, under a virtual display.
      - name: Tests inside VS Code
        run: xvfb-run -a pnpm --filter envsync-vscode run test:e2e

      # The .vsix must contain exactly the bundle, the webview files, README, LICENSE and manifest.
      - name: Package and check contents
        run: |
          node apps/vscode/scripts/package.mjs
          unzip -Z1 apps/vscode/dist-pkg/envsync-vscode.vsix | grep '^extension/' | LC_ALL=C sort > contents.txt
          printf '%s\n' extension/LICENSE.txt extension/dist/extension.cjs extension/media/table.css extension/media/table.js extension/package.json extension/readme.md | LC_ALL=C sort > expected.txt
          diff expected.txt contents.txt
        shell: bash
