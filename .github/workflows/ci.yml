name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
        include:
          # The minimum version declared in package.json "engines".
          - os: ubuntu-latest
            node: "22.12.0"
    steps:
      # Actions are pinned to full commit SHAs; the comment records the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # Not Corepack: the Corepack bundled with Node 22.12.0 cannot run pnpm >= 11, and Corepack
      # releases that can require Node >= 22.22.2. Installing the exact pinned version works on
      # every matrix entry without a third-party action. Keep in sync with "packageManager"
      # (enforced by tests/security/boundaries.test.ts).
      - name: Install pnpm
        run: npm install --global pnpm@12.10.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Runs the real binary through Node's package resolution (not Vitest's aliases). The drift
      # fixture must report findings: exit 1 is the expected result, while 0 or 2 fail the step.
      - name: Smoke-test the built CLI
        run: node apps/cli/dist/bin.js scan tests/fixtures/next-pages-router --format json > /dev/null || test $? -eq 1
        shell: bash

      # The publishable artifact, staged outside the checkout: exactly five files, one bundled
      # script whose only non-builtin import is typescript, and no internal package names.
      - name: Stage, pack and check the publishable CLI
        run: |
          stage="$RUNNER_TEMP/envsync-stage"
          node apps/cli/scripts/stage.mjs --out "$stage"
          npm pack "$stage" --pack-destination "$RUNNER_TEMP" --ignore-scripts
          tarball=$(ls "$RUNNER_TEMP"/envsync-*.tgz)
          tar -tzf "$tarball" | sort > "$RUNNER_TEMP/contents.txt"
          printf '%s\n' package/CHANGELOG.md package/LICENSE package/README.md package/dist/envsync.js package/package.json > "$RUNNER_TEMP/expected.txt"
          diff "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/contents.txt"
          # Code and manifest only: the CHANGELOG legitimately mentions the internal scope.
          if tar -xzOf "$tarball" package/dist/envsync.js package/package.json | grep -q '@envsync-internal'; then echo "internal package name leaked into the package"; exit 1; fi
          # Install the tarball like a user would, in a fresh project outside the checkout.
          consumer="$RUNNER_TEMP/consumer"
          mkdir "$consumer"
          (cd "$consumer" && npm init --yes > /dev/null && npm install --ignore-scripts --no-audit --no-fund "$tarball")
          (cd "$consumer" && npx --no-install envsync --version)
          (cd "$consumer" && npx --no-install envsync scan "$GITHUB_WORKSPACE/tests/fixtures/next-pages-router" --format json > /dev/null) || test $? -eq 1
        shell: bash
